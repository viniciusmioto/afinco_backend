spring:
  application:
    name: afinco-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 10MB
  datasource:
    url: jdbc:sqlite:${AFINCO_DATABASE_PATH:./afinco.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: afinco-sqlite-pool
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${AFINCO_SECURE_COOKIES:false}

afinco:
  security:
    secure-cookies: ${AFINCO_SECURE_COOKIES:false}

spring.lifecycle.timeout-per-shutdown-phase: 20s
